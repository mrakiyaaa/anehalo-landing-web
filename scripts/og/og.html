<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Template for public/og.png. Rendered by scripts/generate-og.mjs; not part of the site. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Figtree:wght@600&display=block">
<style>
  :root {
    --ink: #1B2038; --ink-2: #565D7C; --accent: #2F6BF0; --line: #E1E6F5;
    --hero-base: #FFF7F8; --mesh-a: #FFD3DF; --mesh-b: #C7DCFF; --mesh-c: #FFDCC6; --mesh-d: #D3F4E4;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid; place-items: center; align-content: center; gap: 30px;
    font-family: 'Figtree', 'Segoe UI', sans-serif; color: var(--ink); text-align: center;
    background:
      radial-gradient(55% 60% at 6% 28%, var(--mesh-a), transparent 72%),
      radial-gradient(45% 55% at 96% 16%, var(--mesh-b), transparent 72%),
      radial-gradient(60% 50% at 52% 108%, var(--mesh-c), transparent 72%),
      radial-gradient(38% 42% at 72% 0%, var(--mesh-d), transparent 72%),
      var(--hero-base);
  }
  img { width: 168px; height: 168px; }
  h1 { margin: 0; font-family: 'Fredoka', 'Segoe UI', sans-serif; font-weight: 600; font-size: 82px; line-height: 1.03; letter-spacing: -0.02em; }
  .mark { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 24%, transparent) 62%); }
  p { margin: 0; display: inline-flex; padding: 8px 22px; border: 1px solid var(--line); border-radius: 999px; background: rgb(255 255 255 / 0.7); font-size: 26px; font-weight: 600; color: var(--ink-2); }
</style>
</head>
<body>
  <img src="../../public/icon.webp" alt="">
  <h1>Notes that <span class="mark">save themselves.</span></h1>
  <p>Anehalo · Instant notes for Windows</p>
</body>
</html>
